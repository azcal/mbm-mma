name: mbm-mma-daily
# Cards run Saturday night. The board lands Friday evening once weigh-ins are done, which
# gives a full day to shop lines, then a Saturday midday check that only reports what moved.
# Two cron lines per target: GitHub Actions runs on UTC and ignores daylight saving.
on:
  schedule:
    - cron: "0 1 * 3-10 *"        # 7:00pm MDT, previous evening
    - cron: "0 2 * 1-2,11-12 *"   # 7:00pm MST, previous evening
    - cron: "0 18 * 3-10 *"       # 12:00pm MDT
    - cron: "0 19 * 1-2,11-12 *"  # 12:00pm MST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python daily_mma.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: commit state
        run: |
          mkdir -p logs && date > logs/last_run.txt
          git config user.name mbm-bot && git config user.email bot@mbm
          git add data/ logs/ && git diff --cached --quiet || git commit -m "mma $(date +%F)"
          git push
